name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env # the api service reads env_file .env
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example --profile gpu config --quiet
      - run: shellcheck scripts/*.sh
      - run: node --check pm2/ecosystem.config.cjs
      - run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git submodule status --recursive
